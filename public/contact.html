<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contactez Gestion Incisive — Contact Gestion Incisive">
  <title>Contact — Gestion Incisive</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 24px 64px;
      background: #f4f7f3;
      color: #17251f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.6;
    }
    header, main { width: 100%; max-width: 720px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 24px; margin-bottom: 48px; }
    a { color: inherit; }
    a:focus-visible, input:focus-visible, textarea:focus-visible, button:focus-visible {
      outline: 3px solid #0f766e;
      outline-offset: 3px;
    }
    .brand { font-size: 19px; font-weight: 750; text-decoration: none; }
    .back { min-height: 44px; display: inline-flex; align-items: center; font-size: 14px; }
    .eyebrow { margin: 0 0 12px; color: #40554b; font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(36px, 7vw, 56px); line-height: 1.08; letter-spacing: -.035em; }
    .intro { margin: 20px 0 32px; color: #40554b; font-size: 17px; }
    form { padding: 28px; border: 1px solid #c8d1cb; border-radius: 12px; background: #ffffff; }
    label { display: block; margin: 0 0 8px; font-weight: 650; }
    .field { margin-bottom: 22px; }
    input, textarea {
      display: block;
      width: 100%;
      min-height: 54px;
      padding: 14px;
      border: 1px solid #78877f;
      border-radius: 6px;
      background: #ffffff;
      color: #17251f;
      font: inherit;
      font-size: 16px;
      line-height: 1.5;
    }
    textarea { min-height: 150px; resize: vertical; }
    input:focus, textarea:focus { border-color: #0f766e; }
    button {
      width: 100%;
      min-height: 56px;
      padding: 14px 22px;
      border: 0;
      border-radius: 6px;
      background: #173f35;
      color: #ffffff;
      cursor: pointer;
      font: inherit;
      font-size: 17px;
      font-weight: 700;
    }
    button:hover { background: #0f3028; }
    .note { margin: 22px 0 0; color: #40554b; font-size: 14px; }
    .honey { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
    @media (max-width: 600px) {
      body { padding: 20px 16px 40px; }
      header { margin-bottom: 36px; }
      form { padding: 22px 18px; }
      .back { font-size: 13px; }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">Gestion Incisive</a>
    <a class="back" href="/">← Retour / Back</a>
  </header>
  <main>
    <p class="eyebrow">Contact</p>
    <h1>Parlons de votre clinique.<br>Let’s talk about your clinic.</h1>
    <p class="intro">Remplissez ce formulaire et nous vous répondrons rapidement.<br>Complete this form and we will get back to you shortly.</p>

    <form action="https://formsubmit.co/dan.munteanu@gmail.com" method="POST">
      <input type="hidden" name="_subject" value="Nouvelle demande — Gestion Incisive / New request">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_next" value="https://gestionincisive.ca/merci.html">
      <div class="honey" aria-hidden="true">
        <label for="company-website">Leave this field empty</label>
        <input id="company-website" type="text" name="_honey" tabindex="-1" autocomplete="off">
      </div>

      <div class="field">
        <label for="name">Votre nom / Your name *</label>
        <input id="name" name="name" type="text" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="clinic">Nom de la clinique / Clinic name</label>
        <input id="clinic" name="clinic" type="text" autocomplete="organization">
      </div>
      <div class="field">
        <label for="email">Courriel / Email *</label>
        <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required>
      </div>
      <div class="field">
        <label for="phone">Téléphone / Phone</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel">
      </div>
      <div class="field">
        <label for="message">Vos besoins / Your needs</label>
        <textarea id="message" name="message" rows="5"></textarea>
      </div>
      <button type="submit">Envoyer / Send</button>
    </form>

    <p class="note">Vous préférez le courriel? / Prefer email? <a href="mailto:dan.munteanu@gmail.com">dan.munteanu@gmail.com</a></p>
  </main>
</body>
</html>
