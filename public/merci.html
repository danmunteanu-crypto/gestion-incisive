<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Merci — Gestion Incisive</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 24px;
      background: #f4f7f3;
      color: #17251f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      line-height: 1.6;
    }
    main { width: 100%; max-width: 680px; padding: 48px; border: 1px solid #c8d1cb; border-radius: 12px; background: #ffffff; }
    .mark { margin: 0 0 20px; color: #0f766e; font-size: 48px; line-height: 1; }
    h1 { margin: 0; font-size: clamp(42px, 8vw, 64px); line-height: 1.05; letter-spacing: -.035em; }
    p { margin: 24px 0 32px; color: #40554b; font-size: 18px; }
    a { display: inline-flex; align-items: center; min-height: 52px; padding: 12px 20px; border-radius: 6px; background: #173f35; color: #ffffff; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid #0f766e; outline-offset: 3px; }
    @media (max-width: 600px) { main { padding: 32px 24px; } }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✓</div>
    <h1>Merci!<br>Thank you!</h1>
    <p>Votre message a été envoyé. Nous vous répondrons rapidement.<br>Your message has been sent. We will get back to you shortly.</p>
    <a href="/">Retour au site / Back to the website</a>
  </main>
</body>
</html>
